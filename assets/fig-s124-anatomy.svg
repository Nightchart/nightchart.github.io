<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="860" height="430" rx="10" fill="#fdfdfb" stroke="#e6e4de"/>

  <!-- 左：通告 -->
  <rect x="40" y="60" width="340" height="330" rx="8" fill="#ffffff" stroke="#c9c6bd"/>
  <text x="60" y="92" font-size="15" font-weight="bold" fill="#75736c">人读的：航行通告</text>
  <g font-size="12.5" fill="#33312c">
    <text x="60" y="124" font-weight="bold">×航通〔2023〕0127号</text>
    <text x="60" y="148">某海事局关于某运河航道工程</text>
    <text x="60" y="167">运河航道工程施工№.HD15标段作业的通告</text>
    <text x="60" y="196">一、作业时间：2023年4月7日</text>
    <text x="60" y="215">至2025年2月16日。</text>
    <text x="60" y="241">二、施工安全作业区：起于某大桥南侧</text>
    <text x="60" y="260">200m，止于某港东航道起点……</text>
    <text x="60" y="286">三、施工船舶：××、××、××</text>
    <text x="60" y="305">等30余艘（船名/MMSI/尺度详见通告）。</text>
  </g>
  <g fill="#0f6d5f" font-size="12" font-weight="bold">
    <text x="352" y="124">①</text>
    <text x="352" y="196">②</text>
    <text x="352" y="241">③</text>
    <text x="352" y="286">④</text>
  </g>

  <!-- 中间箭头 -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f6d5f"/>
    </marker>
  </defs>
  <g stroke="#0f6d5f" stroke-width="1.6" fill="none">
    <path d="M368 119 C 410 119, 425 119, 462 119" marker-end="url(#arr)"/>
    <path d="M368 191 C 410 191, 425 191, 462 191" marker-end="url(#arr)"/>
    <path d="M368 236 C 410 236, 425 236, 462 236" marker-end="url(#arr)"/>
    <path d="M368 281 C 410 281, 425 281, 462 281" marker-end="url(#arr)"/>
  </g>

  <!-- 右：数据字段（某数据集.xml 实际值） -->
  <rect x="472" y="60" width="348" height="330" rx="8" fill="#eef4f2" stroke="#0f6d5f" stroke-width="1.5"/>
  <text x="492" y="92" font-size="15" font-weight="bold" fill="#0f6d5f">机读的：真实数据集实际字段</text>
  <g font-size="12.5" fill="#33312c">
    <text x="492" y="124" font-family="Consolas,Menlo,monospace" font-weight="bold">① identity（MRN）</text>
    <text x="506" y="142" font-family="Consolas,Menlo,monospace" fill="#4e6d67">urn:mrn:…:</text>
    <text x="506" y="158" font-family="Consolas,Menlo,monospace" fill="#4e6d67">NavigationWarning:v1:…</text>
    <text x="506" y="174" fill="#75736c" font-size="11.5">×航通〔2023〕0127号 · 某海事局</text>

    <text x="492" y="196" font-family="Consolas,Menlo,monospace" font-weight="bold">② warningHazardType</text>
    <text x="506" y="213" fill="#4e6d67" font-family="Consolas,Menlo,monospace">Construction operation</text>

    <text x="492" y="241" font-family="Consolas,Menlo,monospace" font-weight="bold">③ geometry: Polygon（125 点）</text>
    <text x="506" y="258" fill="#75736c" font-size="11.5">某大桥南侧 → 某港东航道，南北 17.4 km</text>

    <text x="492" y="281" font-family="Consolas,Menlo,monospace" font-weight="bold">④ fixedDateRange</text>
    <text x="506" y="298" fill="#4e6d67" font-family="Consolas,Menlo,monospace">2023-04-08 09:31 → 2025-02-17</text>
    <text x="506" y="314" fill="#75736c" font-size="11.5">到期自动下线，不靠人工撤销</text>

    <text x="492" y="344" font-size="12" fill="#75736c">另有 30 艘施工船的船名/MMSI/尺度共</text>
    <text x="492" y="361" font-size="12" fill="#75736c">74 个属性字段，随警告一起数字化。</text>
  </g>

  <text x="430" y="418" text-anchor="middle" font-size="13" fill="#75736c">同一条警告的两种形态：左边给人读，右边给机器读</text>
</svg>
