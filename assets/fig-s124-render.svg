<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="860" height="430" rx="10" fill="#fdfdfb" stroke="#e6e4de"/>
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#33312c">航警叠加在海图上的真实效果（按 Portrayal Catalogue Ed 2.0.0 重绘）</text>

  <!-- 海图底图 -->
  <rect x="24" y="52" width="812" height="330" rx="6" fill="#a8c8e0"/>
  <!-- 陆地 -->
  <path d="M24 52 H 300 C 288 96, 236 128, 168 140 C 110 150, 60 144, 24 138 Z" fill="#d9c9a3" stroke="#8f9aa5"/>
  <path d="M690 52 H 836 V 120 C 780 132, 736 118, 716 96 C 704 82, 694 66, 690 52 Z" fill="#d9c9a3" stroke="#8f9aa5"/>
  <!-- 等深线 -->
  <path d="M24 268 C 150 250, 300 258, 470 238 C 620 220, 740 232, 836 214" stroke="#5b87ad" stroke-width="1.4" stroke-dasharray="8 4" fill="none"/>
  <!-- 水深注记 -->
  <g fill="#2c4a63" font-family="Consolas,Menlo,monospace" font-size="12">
    <text x="120" y="200">14</text>
    <text x="420" y="180">21</text>
    <text x="700" y="188">9</text>
    <text x="540" y="300">31</text>
  </g>

  <!-- 警告区：三段长条多边形，CHMGD #C045D1 虚线边界 -->
  <g stroke="#C045D1" stroke-width="2.6" stroke-dasharray="13 6" fill="none" stroke-linejoin="round">
    <path d="M 292 296 L 482 221 L 622 171 L 752 121 L 786 183 L 652 235 L 518 287 L 326 358 Z"/>
    <path d="M 482 221 L 518 287"/>
    <path d="M 622 171 L 656 233"/>
  </g>

  <!-- NW 圆形符号：骑在边界上，沿边界重复 -->
  <g font-family="Consolas,Menlo,monospace" font-weight="bold" font-size="14" text-anchor="middle">
    <rect x="557" y="186" width="46" height="27" rx="7" fill="#fdfdfb" stroke="#C045D1" stroke-width="2.6"/>
    <text x="580" y="205" fill="#C045D1">NW</text>
    <rect x="367" y="258" width="46" height="27" rx="7" fill="#fdfdfb" stroke="#C045D1" stroke-width="2.6"/>
    <text x="390" y="277" fill="#C045D1">NW</text>
    <rect x="695" y="140" width="46" height="27" rx="7" fill="#fdfdfb" stroke="#C045D1" stroke-width="2.6"/>
    <text x="718" y="159" fill="#C045D1">NW</text>
  </g>

  <!-- 同一位置多条警告：计数标注 -->
  <circle cx="718" cy="154" r="26" fill="none" stroke="#C045D1" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="748" y="150" font-size="14" fill="#C045D1" font-weight="bold">×2</text>

  <!-- 注释块 -->
  <rect x="44" y="292" width="238" height="76" rx="6" fill="#f4f2ec" stroke="#c9c6bd"/>
  <g font-size="12" fill="#33312c">
    <text x="58" y="314">边界：CHMGD 色虚线（笔宽 0.64mm，</text>
    <text x="58" y="331">周期 40.18mm，NW 符号沿线重复）</text>
    <text x="58" y="352">日间板色值：CHMGD = #C045D1</text>
  </g>

  <text x="430" y="414" text-anchor="middle" font-size="13" fill="#75736c">要素模型：一条警告 = 若干 NavwarnPart（分段带几何）+ NavwarnAreaAffected（受影响区域）+ TextPlacement（文字摆放也是要素）</text>
</svg>
