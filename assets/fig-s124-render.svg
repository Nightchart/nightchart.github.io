<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="860" height="430" rx="10" fill="#fdfdfb" stroke="#e6e4de"/>
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#33312c">S-124 警告区的标准画法：品红虚线边界 + "NW" 标签框</text>
  <text x="30" y="62" font-size="12.5" fill="#75736c">按 OpenS100 对 S-124 数据的实际渲染重绘（示意）</text>

  <!-- 警告区：长条形多边形，三段，品红虚线 -->
  <g stroke="#c848c8" stroke-width="2.2" stroke-dasharray="10 6" fill="none" stroke-linejoin="round">
    <path d="M 282 296 L 482 221 L 622 171 L 762 116 L 798 184 L 658 239 L 518 289 L 318 364 Z"/>
    <!-- 分段内边界 -->
    <path d="M 482 221 L 518 289"/>
    <path d="M 622 171 L 658 239"/>
  </g>

  <!-- NW 标签框：品红圆角矩形 -->
  <g font-family="Consolas,Menlo,monospace" font-weight="bold" font-size="17">
    <rect x="368" y="245" width="64" height="34" rx="8" fill="#fdfdfb" stroke="#c848c8" stroke-width="2.6"/>
    <text x="400" y="268" text-anchor="middle" fill="#c848c8">NW</text>

    <rect x="538" y="190" width="64" height="34" rx="8" fill="#fdfdfb" stroke="#c848c8" stroke-width="2.6"/>
    <text x="570" y="213" text-anchor="middle" fill="#c848c8">NW</text>

    <rect x="676" y="132" width="64" height="34" rx="8" fill="#fdfdfb" stroke="#c848c8" stroke-width="2.6"/>
    <text x="708" y="155" text-anchor="middle" fill="#c848c8">NW</text>
  </g>

  <!-- 右下角说明块 -->
  <g font-size="12.5" fill="#75736c">
    <text x="62" y="90" font-weight="bold" fill="#33312c">三个要点：</text>
    <text x="62" y="114">① 边界用品红虚线（pecked line），不填充区域</text>
    <text x="62" y="138">② 每段区域中央放一个品红 "NW" 标签框</text>
    <text x="62" y="162">③ 画法与确认状态无关：撤销前照常显示</text>
  </g>

  <text x="430" y="414" text-anchor="middle" font-size="13" fill="#75736c">警告文本（正文/参考/撤销链）不在图面上呈现，通过警告列表或弹层查看</text>
</svg>
