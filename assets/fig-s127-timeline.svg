<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="860" height="430" rx="10" fill="#fdfdfb" stroke="#e6e4de"/>
  <text x="40" y="42" font-size="19" font-weight="700" fill="#1f2d3d">S-127：家族里等得最久的 Release Candidate</text>
  <text x="40" y="64" font-size="12" fill="#8a877e">2018 年 12 月发到 RC 1，同期立项的产品早已多轮转正</text>

  <!-- 时间轴 -->
  <line x1="70" y1="120" x2="810" y2="120" stroke="#8a877e" stroke-width="2"/>
  <g font-size="10.5" fill="#44423c" text-anchor="middle">
    <text x="110" y="108">2018.12</text>
    <text x="300" y="108">2022.12</text>
    <text x="450" y="108">2024.12</text>
    <text x="600" y="108">2025.10</text>
    <text x="760" y="108">今天</text>
  </g>
  <g>
    <circle cx="110" cy="120" r="5" fill="#c87f3a"/>
    <circle cx="300" cy="120" r="5" fill="#5b93bd"/>
    <circle cx="450" cy="120" r="5" fill="#5b93bd"/>
    <circle cx="600" cy="120" r="5" fill="#5b93bd"/>
    <circle cx="760" cy="120" r="5" fill="#8a877e"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="136" width="110" height="46" rx="6" fill="#fbf3e4" stroke="#c87f3a"/>
    <text x="115" y="155" font-weight="700" fill="#8a5a1f">S-127 RC 1</text>
    <text x="115" y="172" fill="#8a5a1f">冻结至今</text>
    <rect x="250" y="136" width="100" height="46" rx="6" fill="#eef3f8" stroke="#5b93bd"/>
    <text x="300" y="155" font-weight="700" fill="#2c5f8a">S-100 5.0.0</text>
    <text x="300" y="172" fill="#2c5f8a">框架换代</text>
    <rect x="405" y="136" width="90" height="46" rx="6" fill="#eef3f8" stroke="#5b93bd"/>
    <text x="450" y="155" font-weight="700" fill="#2c5f8a">S-104 2.0.0</text>
    <text x="450" y="172" fill="#2c5f8a">S-129 2.0.0</text>
    <rect x="555" y="136" width="90" height="46" rx="6" fill="#eef3f8" stroke="#5b93bd"/>
    <text x="600" y="155" font-weight="700" fill="#2c5f8a">S-98 2.0.0</text>
    <text x="600" y="172" fill="#2c5f8a">首操版</text>
    <rect x="715" y="136" width="90" height="46" rx="6" fill="#f2f2ee" stroke="#8a877e"/>
    <text x="760" y="155" font-weight="700" fill="#555a63">S-127</text>
    <text x="760" y="172" fill="#555a63">仍在清单上</text>
  </g>

  <!-- 底部：目录遗产三卡 -->
  <g font-size="11.5" fill="#44423c">
    <rect x="50" y="210" width="248" height="100" rx="8" fill="#ffffff" stroke="#e0ddd4"/>
    <rect x="50" y="210" width="6" height="100" rx="3" fill="#2c5f8a"/>
    <text x="70" y="234" font-weight="700" fill="#143d38">31 要素类型 + 14 信息类型</text>
    <text x="70" y="256">VTS 区 · 船报区 · 引航服务 · 避难地</text>
    <text x="70" y="274">海盗风险区 · 军演区 · 双版限制区</text>
    <text x="70" y="296" fill="#8a877e" font-size="10.5">FC 2018-11-29 版实读</text>

    <rect x="306" y="210" width="248" height="100" rx="8" fill="#ffffff" stroke="#e0ddd4"/>
    <rect x="306" y="210" width="6" height="100" rx="3" fill="#b5478c"/>
    <text x="326" y="234" font-weight="700" fill="#143d38">UKC 遗产：标准演化地层</text>
    <text x="326" y="256">UnderkeelClearanceManagementArea</text>
    <text x="326" y="274">2018 年先在 S-127 占位，</text>
    <text x="326" y="292" fill="#8a877e" font-size="10.5">后来整体迁给专职的 S-129</text>

    <rect x="562" y="210" width="248" height="100" rx="8" fill="#ffffff" stroke="#e0ddd4"/>
    <rect x="562" y="210" width="6" height="100" rx="3" fill="#0f8a6d"/>
    <text x="582" y="234" font-weight="700" fill="#143d38">样例数据里有中文</text>
    <text x="582" y="256">Regulations 物标双语 featureName：</text>
    <text x="582" y="274">"特定船舶在通航分道中的航行要求"</text>
    <text x="582" y="296" fill="#8a877e" font-size="10.5">displayName = true，正式组成而非彩蛋</text>
  </g>

  <!-- 底条 -->
  <g font-size="11.5" fill="#44423c">
    <rect x="40" y="330" width="780" height="60" rx="8" fill="#ffffff" stroke="#e0ddd4"/>
    <rect x="40" y="330" width="6" height="60" rx="3" fill="#c87f3a"/>
    <text x="60" y="354">ENC 画海上有什么；S-127 登记"这片水面上谁在管、怎么管、找谁"——</text>
    <text x="60" y="376">简化几何 + 管理信息，是 ENC 的补充层。规范的优先级跟着船走，它等的不是文档，是生态。</text>
  </g>
</svg>
