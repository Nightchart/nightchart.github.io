<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="860" height="430" rx="10" fill="#fdfdfb" stroke="#e6e4de"/>
  <text x="40" y="42" font-size="19" font-weight="700" fill="#143d38">S-131 Portrayal Catalogue 2.0.0：整包实测</text>
  <text x="40" y="64" font-size="12" fill="#8a877e">53 个文件一次性喂给解析器 · 41 个规则文件全部解析 · 34 个物标提取出渲染指令流</text>

  <!-- 左：目录树 -->
  <text x="40" y="100" font-size="13" font-weight="600" fill="#5b584f">分发目录</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#33322e">
    <text x="40" y="130">131_Portrayal_Catalogue_2.0.0/</text>
    <text x="62" y="154" fill="#8a877e">portrayal_catalogue.xml</text>
    <text x="62" y="178">Rules/  <tspan fill="#0f6d5f" font-weight="600">41 个 Lua</tspan></text>
    <text x="84" y="200" fill="#8a877e">├ AnchorBerth · Berth · Bollard · LockBasin …</text>
    <text x="84" y="222" fill="#8a877e">└ PortrayalAPI · S100Scripting（运行时框架）</text>
    <text x="62" y="246">Symbols/  <tspan fill="#0f6d5f" font-weight="600">6 个 SVG</tspan></text>
    <text x="84" y="268" fill="#8a877e">├ 131SYMBL3 · 131SYMBL3L · 131SYMBL3S</text>
    <text x="84" y="290" fill="#8a877e">├ 131INFRM · CHDATD01 · QUESMRK1</text>
    <text x="62" y="314">ColorProfiles/  <tspan fill="#0f6d5f" font-weight="600">colorProfile.xml</tspan></text>
    <text x="62" y="338">LineStyles/  <tspan fill="#0f6d5f" font-weight="600">QUESMRK1.xml</tspan></text>
  </g>
  <!-- 树连线 -->
  <g stroke="#c9c6bd" stroke-width="1">
    <path d="M56 136 V 332"/>
    <path d="M56 172 H 62"/><path d="M56 240 H 62"/><path d="M56 308 H 62"/><path d="M56 332 H 62"/>
  </g>

  <!-- 中：箭头 -->
  <g stroke="#0f6d5f" stroke-width="2" fill="none">
    <path d="M370 210 H 440"/>
    <path d="M432 202 L 444 210 L 432 218"/>
  </g>
  

  <!-- 右：解析结果卡 -->
  <rect x="456" y="86" width="364" height="290" rx="8" fill="#f1efe9" stroke="#e0ddd4"/>
  <text x="478" y="116" font-size="13" font-weight="600" fill="#5b584f">解析结果</text>
  <g font-size="13" fill="#33322e">
    <rect x="478" y="130" width="320" height="34" rx="5" fill="#ffffff" stroke="#e0ddd4"/>
    <text x="492" y="152">XML <tspan font-weight="700" fill="#0f6d5f">3</tspan><tspan fill="#8a877e" font-size="11">　目录索引 + 颜色配置 + 线样式</tspan></text>
    <rect x="478" y="170" width="320" height="34" rx="5" fill="#ffffff" stroke="#e0ddd4"/>
    <text x="492" y="192">SVG <tspan font-weight="700" fill="#0f6d5f">6</tspan><tspan fill="#8a877e" font-size="11">　131 系 ×4 + CHDATD01 + QUESMRK1</tspan></text>
    <rect x="478" y="210" width="320" height="34" rx="5" fill="#ffffff" stroke="#e0ddd4"/>
    <text x="492" y="232">Lua <tspan font-weight="700" fill="#0f6d5f">41</tspan><tspan fill="#8a877e" font-size="11">　33 物标规则 + 8 框架 / 公共</tspan></text>
    <rect x="478" y="250" width="320" height="34" rx="5" fill="#ffffff" stroke="#e0ddd4"/>
    <text x="492" y="272">颜色 <tspan font-weight="700" fill="#0f6d5f">67</tspan> token<tspan fill="#8a877e" font-size="11">　Day / Dusk / Night 三板</tspan></text>
    <rect x="478" y="290" width="320" height="40" rx="5" fill="#0f6d5f"/>
    <text x="492" y="315" fill="#f2f0e8">渲染指令流 <tspan font-weight="700">34</tspan> 条</text>
  </g>

  <!-- 底注 -->
  <text x="456" y="352" font-size="11" fill="#8a877e">41 个 Lua = 33 物标规则 + PortrayalAPI / Model /</text>
  <text x="456" y="368" font-size="11" fill="#8a877e">S100Scripting / main 等 8 个框架与公共文件</text>
</svg>
