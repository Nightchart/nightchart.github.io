<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="860" height="430" rx="10" fill="#fdfdfb" stroke="#e6e4de"/>
  <text x="40" y="42" font-size="19" font-weight="700" fill="#1f2d3d">S-421 航线的三层骨架：航点在哪转弯 · 航段开多快 · 动作点做什么</text>
  <text x="40" y="64" font-size="12" fill="#8a877e">Route → RouteWaypoints（航点串）→ RouteWaypointLeg（航段属性）+ RouteActionPoint（动作点）· FC 6 要素 + 7 信息</text>

  <!-- 航线画布 -->
  <rect x="40" y="86" width="520" height="270" rx="8" fill="#eef4f6" stroke="#d8e2e6"/>
  <!-- 航线 -->
  <path d="M90 300 L 230 210 L 380 250 L 500 150" fill="none" stroke="#2c5f8a" stroke-width="3"/>
  <!-- 航点 -->
  <g>
    <circle cx="90" cy="300" r="8" fill="#2c5f8a"/>
    <circle cx="230" cy="210" r="8" fill="#2c5f8a"/>
    <circle cx="380" cy="250" r="8" fill="#2c5f8a"/>
    <circle cx="500" cy="150" r="8" fill="#2c5f8a"/>
  </g>
  <!-- 航段标注 -->
  <text x="128" y="242" font-size="11" fill="#2c5f8a">Leg① 12.5 kn · XTD 185m</text>
  <text x="292" y="262" font-size="11" fill="#2c5f8a">Leg② 10.0 kn · XTD 200m</text>
  <text x="404" y="188" font-size="11" fill="#2c5f8a">Leg③ 8.5 kn · XTD 200m</text>
  <!-- 动作点 -->
  <g>
    <rect x="218" y="184" width="24" height="18" rx="4" fill="#0f8a6d"/>
    <text x="252" y="182" font-size="10.5" fill="#0b5347">ActionPoint：向 VTS 报告</text>
    <rect x="392" y="278" width="24" height="18" rx="4" fill="#0f8a6d"/>
    <text x="352" y="312" font-size="10.5" fill="#0b5347">ActionPoint：呼叫引航登轮</text>
  </g>
  <!-- 起终点 -->
  <text x="72" y="326" font-size="10.5" fill="#8a877e">起港</text>
  <text x="486" y="136" font-size="10.5" fill="#8a877e">目的港</text>
  <text x="150" y="336" font-size="11" fill="#44423c" font-weight="700">Route（根物标）</text>

  <!-- 右侧：目录三卡 -->
  <g font-size="11.5" fill="#44423c">
    <rect x="580" y="86" width="240" height="82" rx="8" fill="#ffffff" stroke="#e0ddd4"/>
    <rect x="580" y="86" width="6" height="82" rx="3" fill="#2c5f8a"/>
    <text x="600" y="110" font-weight="700" fill="#143d38">FC 6 要素 + 7 信息</text>
    <text x="600" y="132">Route / Waypoints / Waypoint</text>
    <text x="600" y="150">WaypointLeg / ActionPoints / ActionPoint</text>

    <rect x="580" y="180" width="240" height="82" rx="8" fill="#ffffff" stroke="#e0ddd4"/>
    <rect x="580" y="180" width="6" height="82" rx="3" fill="#0f8a6d"/>
    <text x="600" y="204" font-weight="700" fill="#143d38">GML 编码 · 三档测试集</text>
    <text x="600" y="226">GMIN 最小几何 → GBASIC → GFULL</text>
    <text x="600" y="244">渲染管线按成熟度逐档适配</text>

    <rect x="580" y="274" width="240" height="82" rx="8" fill="#ffffff" stroke="#e0ddd4"/>
    <rect x="580" y="274" width="6" height="82" rx="3" fill="#b5478c"/>
    <text x="600" y="298" font-weight="700" fill="#143d38">IEC 主导 · IHO 发编号</text>
    <text x="600" y="320">IEC 63173-1 · TC 80 · Ed 2 CDV</text>
    <text x="600" y="338">投票期至 2026-11-13 · 稳定期 2030</text>
  </g>

  <!-- 底条 -->
  <g font-size="11.5" fill="#44423c">
    <rect x="40" y="374" width="780" height="34" rx="8" fill="#ffffff" stroke="#e0ddd4"/>
    <rect x="40" y="374" width="6" height="34" rx="3" fill="#2c5f8a"/>
    <text x="60" y="396">S-421 是 S-129 UKCM 计划的航线输入首选 · RTZ 的 S-100 化重制 · 航线是跨系统流动最频繁的数据</text>
  </g>
</svg>
